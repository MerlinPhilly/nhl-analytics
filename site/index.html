<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>NHL Analytics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">NHL&nbsp;Analytics</a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/trends" data-nav="trends">Trends</a>
    <a href="#/goals" data-nav="goals">Goal Leaders</a>
    <a href="#/screener" data-nav="screener">Screener</a>
    <a href="#/compare" data-nav="compare">Compare</a>
    <a href="#/games" data-nav="games">Games</a>
  </nav>
  <div class="search">
    <input id="search" type="search" placeholder="Search player or team…" autocomplete="off" aria-label="Search players and teams">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <button id="theme" class="icon-btn" title="Toggle light/dark" aria-label="Toggle light/dark">Light / Dark</button>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<footer class="foot">
  <span id="updated"></span>
  <span>Data: NHL public stats feeds · Personal research tool · Not affiliated with the NHL</span>
</footer>
<div id="tooltip" class="tooltip" hidden></div>
<script>
  // GitHub Pages lets browsers keep this page for up to 10 minutes. Ask the server for the
  // current version every time (never cached) and load that exact app version.
  (function () {
    var load = function (v) {
      var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "style.css?v=" + v; document.head.appendChild(l);
      var s = document.createElement("script"); s.src = "app.js?v=" + v; document.body.appendChild(s);
    };
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; }).catch(function () { return ""; })
      .then(function (v) { load((v || "").trim() || String(Date.now())); });
  })();
</script>
</body>
</html>
