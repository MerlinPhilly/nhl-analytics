name: Nightly update

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 5:17 AM Eastern (6:17 during daylight time), after all games end
    - cron: "47 12 * * *"   # backup run, 7:47 AM Eastern
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nhl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if ! gh release download data-store -p nhl.duckdb -D data; then
            echo "::error::No database found. Run the 'Backfill history' workflow first."
            exit 1
          fi

      - name: Pull last night's games
        run: python -m nhl.ingest daily

      - name: Save database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data-store data/nhl.duckdb --clobber

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          # The page reads this on every visit and loads exactly this app version
          echo "${GITHUB_SHA::8}-${GITHUB_RUN_ID}" > _site/version.txt
          python -m nhl.export --out _site/data

      - name: Record run status
        # A small commit each night keeps GitHub from pausing the schedule
        # (it disables scheduled workflows in repos with no activity for 60 days).
        run: |
          python -c "import json; m=json.load(open('_site/data/meta.json')); open('STATUS.md','w').write(f\"# Data status\n\n- Last refresh: {m['updated_at']}\n- Games through: {m['last_game']}\n- Games: {m['counts']['games']:,}\n- Skater game rows: {m['counts']['skater_games']:,}\n- Goalie game rows: {m['counts']['goalie_games']:,}\n- Players: {m['counts']['players']:,}\n\")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet || (git commit -m "Nightly data refresh" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
